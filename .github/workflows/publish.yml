name: Publish Web SDK to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish release to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@12.0.2

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify package identity and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$package_name" = "@januaryai/web-sdk"
          test "$RELEASE_TAG" = "$expected_tag"

      - name: Validate documentation
        run: node scripts/check-documentation.mjs

      - name: Build and test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish public package
        run: npm publish --access public
